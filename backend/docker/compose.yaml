services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: numcounts
      MYSQL_USER: numcounts_app
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pchange-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy

  seed:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.db.seed"]
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql_data:
